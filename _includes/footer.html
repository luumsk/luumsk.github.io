  <footer id="contact">
    <div class="wrap">
      <div>
        <h2>Let's collaborate</h2>
        <p>Open to research collaborations on agentic AI, LLM reliability, and medical imaging.</p>
      </div>
      <div class="actions" style="margin-top:0">
        <a class="btn filled js-email" href="#contact" data-u="luumsk" data-d="gmail" data-t="com"><span class="ms">mail</span>Email me</a>
        {% include social-icons.html %}
        {% if site.posts.size > 0 %}<a class="btn icon" href="/blog/feed.xml" aria-label="RSS feed" title="RSS feed"><span class="ms">rss_feed</span></a>{% endif %}
      </div>
    </div>
    <div class="wrap copy">© <span id="y">{{ site.time | date: "%Y" }}</span> Luu Minh Sao Khue</div>
  </footer>
  <script>
    // Build the mailto link only on click, so the address never appears in the page source.
    document.querySelectorAll('.js-email').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        var d = a.dataset;
        window.location.href = 'mai' + 'lto:' + d.u + '@' + d.d + '.' + d.t;
      });
    });
  </script>
